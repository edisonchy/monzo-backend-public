pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 64k;
    client_body_timeout 10s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Monzo-Client-IP $remote_addr;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    # Global single-owner intake limit: don't trust forwarded client IPs.
    limit_req_zone $server_port zone=monzo_hooks_by_port:1m rate=5r/s;
    # Per-client budgets; only the pinned spending ingress can set the real address.
    limit_req_zone $server_port zone=dashboard_global_requests:1m rate=100r/s;
    limit_req_zone $server_port zone=dashboard_global_login:1m rate=5r/s;
    limit_conn_zone $server_port zone=dashboard_global_connections:1m;
    limit_req_zone $binary_remote_addr zone=dashboard_requests:1m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=dashboard_assets:1m rate=40r/s;
    limit_req_zone $binary_remote_addr zone=dashboard_login:1m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=dashboard_connections:1m;
    limit_conn_zone $binary_remote_addr zone=dashboard_streams:1m;
    server {
        listen 8080;
        set $api http://api:8080;
        set $frontend http://frontend:3000;
        location = /health { return 200 'alive'; }
        location = /v1/dashboard/events {
            proxy_pass $api;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 65s;
        }
        location /v1/ { proxy_pass $api; }
        location /dashboard/ { proxy_pass $api; }
        location /webhooks/ { return 404; }
        location / { proxy_pass $frontend; }
    }
    # Public browser listener behind the spending Tailscale Funnel.
    server {
        listen 8082;
        set_real_ip_from 192.0.2.5;
        real_ip_header X-Forwarded-For;
        real_ip_recursive off;
        server_name spending.example.invalid;
        if ($http_host != "spending.example.invalid") { return 404; }
        set $api http://api:8080;
        set $frontend http://frontend:3000;
        limit_req zone=dashboard_requests burst=30 nodelay;
        limit_req zone=dashboard_global_requests burst=100 nodelay;
        limit_req_status 429;
        limit_conn dashboard_connections 48;
        limit_conn dashboard_global_connections 128;
        limit_conn_status 429;
        keepalive_timeout 15s;
        send_timeout 20s;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 15s;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        # Browser cookies only. Owner/automation bearer credentials never work here.
        proxy_set_header Host "spending.example.invalid";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "spending.example.invalid";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Monzo-Client-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Authorization "";
        proxy_set_header X-Middleware-Subrequest "";
        proxy_set_header X-Nonce "";
        proxy_set_header Connection "";

        location = /dashboard/login {
            if ($request_method != POST) { return 405; }
            limit_req zone=dashboard_login burst=5 nodelay;
            limit_req zone=dashboard_global_login burst=20 nodelay;
            proxy_pass $api;
        }
        location = /dashboard/logout {
            if ($request_method != POST) { return 405; }
            proxy_pass $api;
        }
        location = /dashboard/session {
            if ($request_method != GET) { return 405; }
            proxy_pass $api;
        }
        location = /v1/dashboard/events {
            if ($request_method != GET) { return 405; }
            limit_conn dashboard_connections 48;
        limit_conn dashboard_global_connections 128;
            limit_conn dashboard_streams 12;
            proxy_pass $api;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 65s;
        }
        location = /v1/dashboard/categories {
            if ($request_method !~ "^(GET|POST|DELETE)$") { return 405; }
            proxy_pass $api;
        }
        location = /v1/dashboard/budgets {
            if ($request_method !~ "^(GET|PUT)$") { return 405; }
            proxy_pass $api;
        }
        location ~ "^/v1/(status|dashboard/(bootstrap|revision|report|transactions|review-merchants|quality|balances|merchant-options|rules))$" {
            if ($request_method != GET) { return 405; }
            proxy_pass $api;
        }
        location ~ "^/v1/dashboard/transactions/[A-Za-z0-9_-]+$" {
            if ($request_method != GET) { return 405; }
            proxy_pass $api;
        }
        location ~ "^/v1/dashboard/transactions/[A-Za-z0-9_-]+/category-preview$" {
            if ($request_method != POST) { return 405; }
            proxy_pass $api;
        }
        location ~ "^/v1/dashboard/transactions/[A-Za-z0-9_-]+/(category-change|card-verification)$" {
            if ($request_method != PUT) { return 405; }
            proxy_pass $api;
        }
        location ~ "^/v1/dashboard/category-changes/[A-Za-z0-9_-]+/undo$" {
            if ($request_method != POST) { return 405; }
            proxy_pass $api;
        }
        location ~ "^/v1/dashboard/rules/[A-Za-z0-9_-]+$" {
            if ($request_method !~ "^(PUT|DELETE)$") { return 405; }
            proxy_pass $api;
        }
        # These are the authenticated controls used by Settings, not automation APIs.
        location ~ "^/v1/(sync|oauth/start|connection/discover|processing/(pause|resume))$" {
            if ($request_method != POST) { return 405; }
            proxy_pass $api;
        }
        location = /oauth/callback {
            if ($request_method != GET) { return 405; }
            proxy_read_timeout 75s;
            proxy_pass $api;
        }
        location ^~ /api/chat/ {
            if ($request_method !~ "^(GET|POST)$") { return 405; }
            client_max_body_size 8k;
            proxy_read_timeout 185s;
            proxy_buffering off;
            proxy_pass $frontend;
        }
        location ~ "^/(spending|transactions|review|settings|balances|budgets|chat)?$" {
            if ($request_method !~ "^(GET|HEAD)$") { return 405; }
            proxy_pass $frontend;
        }
        location ~ "^/(_next/static/|assets/)" {
            if ($request_method !~ "^(GET|HEAD)$") { return 405; }
            limit_req zone=dashboard_assets burst=80 nodelay;
            limit_req zone=dashboard_global_requests burst=100 nodelay;
            proxy_pass $frontend;
        }
        location / { return 404; }
    }
    server {
        listen 8081;
        set $api http://api:8080;
        location ~ "^/webhooks/monzo/[A-Za-z0-9_-]{32,128}$" {
            if ($request_method != POST) { return 405; }
            if ($http_content_type !~* "^application/json(;|$)") { return 415; }
            limit_req zone=monzo_hooks_by_port burst=20 nodelay;
            limit_req_status 429;
            proxy_pass $api;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_read_timeout 20s;
        }
        location / { return 404; }
    }
}
